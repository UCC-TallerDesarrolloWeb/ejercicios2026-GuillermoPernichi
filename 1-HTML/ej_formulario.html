<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio Formulario</title>
    <style>
      form {
        display: block;
        margin-top: 0em;
      }
    </style>
  </head>
  <body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>
      Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!
    </h3>
    <form name="form-suscripcion">
      <p>Nombre:</p>
      <input type="text" name="nombre" placeholder="Ingrese su nombre" />
      <p>Apellido:</p>
      <input type="text" name="apellido" placeholder="Ingrese su apellido" />
      <p>
        Sexo: Masculino
        <input type="radio" name="sex" value="masculino" /> Femenino
        <input type="radio" name="sex" value="femenino" />
      </p>
      <p>Edad:</p>
      <input type="number" name="edad" placeholder="Edad" />
      <p>Email:</p>
      <input type="email" name="email" placeholder="usuario@dominio.com" />
      <p>Usuario:</p>
      <input type="text" name="usuario" placeholder="Nombre de Usuario" />
      <p>Password:</p>
      <input type="password" name="password" placeholder="Contrasena" />
      <p>Confirmar Password:</p>
      <input type="password" name="segunda-password" placeholder="Contrasena" />
      <p>
        Tipo de servicio:<select name="tipo-servicio">
          <option value="Free">Free</option>
          <option value="Standard">Standard</option>
          <option value="Premium">Premium</option>
        </select>
      </p>
      <p>
        Tema: Política <input type="checkbox" value="politica" /> Negocios
        <input type="checkbox" value="negocios" /> Tecnología
        <input type="checkbox" value="tecnologia" /> Salud
        <input type="checkbox" value="salud" />
      </p>
      <p>
        Agregue un comentario:
        <textarea>
        Deje su comentario...
      </textarea
        >
      </p>
      <p>
        <button type="button">Boton de Enviar</button>
      </p>
    </form>
  </body>
</html>
